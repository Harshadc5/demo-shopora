<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 250px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 15px;
      background-color: #f8f9fa;
      color: #333;
    }
    h3 {
      margin-top: 0;
      font-size: 16px;
      color: #0056b3;
      margin-bottom: 10px;
    }
    label {
      font-size: 12px;
      font-weight: bold;
      display: block;
      margin-bottom: 4px;
    }
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-family: monospace;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #0056b3;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
      font-weight: bold;
      min-height: 15px;
    }
    .success { color: #28a745; }
    .error { color: #dc3545; }
  </style>
</head>
<body>
  <h3>AIORA Test Suite Catcher</h3>
  
  <label for="filename">Save As (Filename):</label>
  <input type="text" id="filename" placeholder="e.g. homedepot-cart" />
  
  <button id="captureBtn">Capture DOM & Save</button>
  
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
